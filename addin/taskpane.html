<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
  <title>Hermes</title>
  <link rel="stylesheet" href="/taskpane.css"/>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="title">Hermes<span class="bot" id="botName"></span></div>
    <div class="topbar-actions">
      <button id="btnNew" class="text-btn">Новый чат</button>
      <button id="btnSettings" class="icon-btn" title="Настройки">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 3.2v2M10 14.8v2M3.2 10h2M14.8 10h2M5.2 5.2l1.4 1.4M13.4 13.4l1.4 1.4M14.8 5.2l-1.4 1.4M6.6 13.4l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <section id="settings" class="settings hidden">
    <label>Провайдер<select id="providerSel"></select></label>
    <label>Усилие<select id="reasonSel">
      <option value="auto">auto</option><option value="low">low</option>
      <option value="medium">medium</option><option value="high">high</option>
    </select></label>
    <label class="switch"><input type="checkbox" id="autoWrite" checked/> писать результат в лист сразу</label>
    <label class="switch"><input type="checkbox" id="useCtx" checked/> брать выделение как контекст</label>
    <label class="stacked">Другие чаты бота<select id="sessionPick"></select></label>
  </section>

  <main id="chat" class="chat"></main>

  <div class="ctxbar">
    <span class="chip" id="ctxLabel">—</span>
    <button id="btnRefresh" class="link">обновить</button>
    <button id="btnEditCtx" class="link">править данные</button>
  </div>

  <section id="ctxEdit" class="ctxedit hidden">
    <textarea id="ctxCsv" spellcheck="false" rows="6" placeholder="CSV: первая строка — шапка. Можно править руками."></textarea>
    <div class="ctxedit-actions"><button id="btnCtxDone" class="primary sm">Готово</button></div>
  </section>

  <section id="atts" class="atts hidden">
    <div class="atts-row" id="attsRow"></div>
    <div class="atts-hint">перетащите файлы в панель, вставьте из буфера (Ctrl+V) или выберите скрепкой — картинки и документы попадут агенту</div>
  </section>

  <footer class="composer">
    <div class="composer-box">
      <button id="btnAttach" class="attach" title="Прикрепить файл или картинку">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 6.5 8 11a2 2 0 0 0 2.8 2.8l4.7-4.7a3.5 3.5 0 0 0-5-5L5.8 8.8a5 5 0 0 0 7 7l3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <input type="file" id="filePick" multiple hidden/>
      <textarea id="prompt" rows="1" placeholder="Спросите что угодно о таблице"></textarea>
      <button id="btnSend" class="send" title="Отправить">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5v-11m0 0L5.5 9M10 4.5 14.5 9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnStop" class="send stop hidden" title="Остановить">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1.6" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="footer-row">
      <div class="model-pick">
        <select id="modelSel" title="Модель"></select>
        <svg viewBox="0 0 16 16" class="chev" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <button id="btnOpen" class="link">открыть в Hermes</button>
      <span id="sessionInfo" class="muted">подключение…</span>
    </div>
  </footer>


  <div id="toast" class="toast hidden"></div>
  <script src="/taskpane.js"></script>
</body>
</html>
